name: release

# Build the pkg from the release tag and attach it to the release.
# Keeps releases self-contained: no manual artifact upload step that
# can be forgotten (this exact gap left v0.0.5 without its pkg asset).

on:
  release:
    types: [published]

env:
  OO_PS4_TOOLCHAIN: ${{ github.workspace }}/OpenOrbis/PS4Toolchain
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
  TOOLCHAIN_URL: https://github.com/illusion0001/OpenOrbis-PS4-Toolchain/releases/download/0.0.1.416/toolchain.tar.gz

permissions:
  contents: write

jobs:
  attach-pkg:
    name: Build and attach pkg asset
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout (release tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install toolchain dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm python3 cmake

      - name: Host unit tests (portable core)
        run: make test

      - name: Cache OpenOrbis toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.OO_PS4_TOOLCHAIN }}
          key: oosdk-toolchain-0.0.1.416-linux

      - name: Download OpenOrbis toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p OpenOrbis
          curl -sL "$TOOLCHAIN_URL" | tar xz -C ./

      - name: Checkout SDL-PS4
        uses: actions/checkout@v4
        with:
          repository: bucanero/SDL-PS4
          ref: ps4
          path: SDL-PS4

      - name: Cache SDL-PS4 library
        id: cache-sdl2
        uses: actions/cache@v4
        with:
          path: SDL-PS4/orbis/libSDL2.a
          key: sdl-ps4-bucanero-ps4-linux-v1

      - name: Build SDL-PS4 (Piglet GPU renderer)
        if: steps.cache-sdl2.outputs.cache-hit != 'true'
        working-directory: SDL-PS4
        run: |
          mkdir -p orbis
          # HAVE_GCC_WERROR_DECLARATION_AFTER_STATEMENT: the fork predates the
          # stricter clang diagnostics on declaration-after-statement; keep them
          # as warnings so the build does not depend on the runner's clang version.
          cmake -S . -B orbis --toolchain cmake/openorbis.cmake -DCMAKE_BUILD_TYPE=Release \
            -DHAVE_GCC_WERROR_DECLARATION_AFTER_STATEMENT=FALSE
          cmake --build orbis -j "$(nproc)"

      - name: Install SDL-PS4 into toolchain
        run: cp SDL-PS4/orbis/libSDL2.a "${OO_PS4_TOOLCHAIN}/lib/"

      - name: Build
        run: make

      - name: Attach pkg to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          cp IV0000-RPIN00001_00-RPINEXTGEN000000.pkg \
             "RemotePkgInstallerNextGen-${VERSION}.pkg"
          gh release upload "$TAG" "RemotePkgInstallerNextGen-${VERSION}.pkg" --clobber
